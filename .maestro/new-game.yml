appId: com.cleansudoku.app
env:
  PUZZLE: '004000800009127500070060010000985000007000100080030090000502000100000007060000040'
---
- launchApp:
    clearState: true

# Nothing to resume, so the New game sheet is open.
- assertVisible:
    id: new-game-sheet
- tapOn:
    id: difficulty-easy
- assertVisible:
    id: board
- assertVisible:
    id: difficulty-label
    text: 'Easy'

# Abandoning a game with progress asks first.
- runFlow:
    file: shared/start-puzzle.yml
    env:
      PUZZLE: ${PUZZLE}
- tapOn:
    id: cell-0
- tapOn:
    id: digit-6
- tapOn:
    id: new-game-button
- tapOn:
    id: difficulty-hard
- assertVisible: 'Start a new game?'
- tapOn: '(?i)keep playing'
- tapOn:
    id: new-game-cancel
- assertVisible: 'Row 1, column 1, entered 6'
- tapOn:
    id: new-game-button
- tapOn:
    id: difficulty-hard
- tapOn: '(?i)start new game'
- assertVisible:
    id: difficulty-label
    text: 'Hard'
