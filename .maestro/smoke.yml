appId: com.cleansudoku.app
---
- launchApp:
    clearState: true

# No game yet: the home hub is the entry point, with no Continue card.
- assertVisible:
    id: screen-home
- assertVisible: 'SUDOKU'
- assertVisible: 'Pick a level to begin.'
- assertNotVisible:
    id: continue-card
- assertVisible:
    id: new-game-button

# Stats and Settings open as pushed screens and return to Home.
- tapOn:
    id: home-stats
- assertVisible:
    id: screen-stats
- tapOn:
    id: header-back
- assertVisible:
    id: screen-home
- tapOn:
    id: home-settings
- assertVisible:
    id: screen-settings
- tapOn:
    id: header-back
- assertVisible:
    id: screen-home
