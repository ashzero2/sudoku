appId: com.cleansudoku.app
env:
  PUZZLE: '614359872839127564572468913341985726957246138286731495493572681128694357765813240'
---
- runFlow:
    file: shared/start-puzzle.yml
    env:
      PUZZLE: ${PUZZLE}
# One mistake, then the correct digit solves the puzzle.
- tapOn:
    id: cell-80
- tapOn:
    id: digit-1
- assertVisible: 'Row 9, column 9, incorrect 1'
- tapOn:
    id: digit-9
- assertVisible:
    id: completion-modal
- assertVisible: 'Solved'
- assertVisible:
    id: completion-new-best
- assertVisible:
    id: completion-mistakes
    text: '1'
- assertVisible:
    id: completion-hints
    text: '0'
- tapOn:
    id: completion-close
- assertVisible: 'No game in progress'

# Closing the dialog leaves the New game sheet closed until it is asked for.
- assertNotVisible:
    id: new-game-sheet
- tapOn:
    id: new-game-button
- assertVisible:
    id: new-game-sheet
- tapOn:
    id: new-game-cancel

# The result is in the stats.
- tapOn:
    id: tab-stats
- assertVisible: 'Started: 1'
- assertVisible: 'Solved: 1'
- assertVisible: 'Completion rate: 100%'
- assertVisible: 'Current streak: 1'
- assertVisible: 'Mistakes: 1'
- assertVisible: 'Very easy best time: [0-9]+:[0-9]{2}'
