appId: com.cleansudoku.app
---
- launchApp:
    clearState: true

# With no game to resume, the New game sheet opens over the Game tab.
- assertVisible:
    id: new-game-sheet
- tapOn:
    id: new-game-cancel
- assertVisible:
    id: screen-game
- tapOn:
    id: tab-stats
- assertVisible:
    id: screen-stats
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings
- tapOn:
    id: tab-game
- assertVisible:
    id: screen-game
