appId: com.cleansudoku.app
---
- launchApp:
    clearState: true

# Wait for the home screen to finish loading; a link sent earlier arrives
# before the app is listening and is lost.
- assertVisible:
    id: screen-home
- openLink: sudoku://e2e/start?puzzle=${PUZZLE}&difficulty=very-easy
- assertVisible:
    id: board
