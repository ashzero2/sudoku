appId: com.cleansudoku.app
env:
  PUZZLE: '004000800009127500070060010000985000007000100080030090000502000100000007060000040'
---
- runFlow:
    file: shared/start-puzzle.yml
    env:
      PUZZLE: ${PUZZLE}
- tapOn:
    id: cell-0
- tapOn:
    id: digit-6
- tapOn:
    id: tool-notes
- tapOn:
    id: cell-16
- tapOn:
    id: digit-4
- tapOn:
    id: tool-notes

# Kill the app and start it again without clearing its data.
- stopApp
- launchApp

# A cold launch lands on Home; the saved game is behind Continue.
- assertVisible:
    id: screen-home
- assertVisible:
    id: continue-card
- assertNotVisible:
    id: board

# Continue starts the clock and restores the board, notes and history.
- tapOn:
    id: continue-card
- assertVisible:
    id: board
- assertNotVisible:
    id: pause-overlay
- assertVisible: 'Row 1, column 1, entered 6'
- assertVisible: 'Row 2, column 8, notes 4'
- assertVisible:
    id: tool-undo
    enabled: true
